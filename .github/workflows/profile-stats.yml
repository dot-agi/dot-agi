name: Generate Profile Stats

on:
  schedule:
    - cron: "0 18 * * *"  # Daily at 18:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Three triggers can overlap, and two runs pushing to main would collide.
concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the push below can rebase onto a moved remote tip.
          fetch-depth: 0

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # With SETTING_JSON the action emits only this themed file instead of
          # its ten stock variants, so the palette matches the activity graph.
          SETTING_JSON: .github/profile-3d/cyberpunk.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Match the 3D graph's typography
        run: node .github/scripts/theme-3d.mjs
        env:
          TARGET: profile-3d-contrib/profile-cyberpunk.svg

      - name: Render README panels
        run: node .github/scripts/render-panels.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT_DIR: assets

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets

          # Test the index rather than git commit's exit code, so a real commit
          # failure still fails the job instead of being read as "no changes".
          if git diff --cached --quiet; then
            echo "Graphs are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile stats graphs"

          # Another run, or a person, may have pushed while the graphs regenerated.
          # If that push also regenerated these SVGs, the rebase hits a content
          # conflict; "theirs" during a rebase means the commit being replayed, so
          # this run's fresher regeneration wins. Only conflicting files are taken
          # that way, so unrelated work in the other commit survives untouched.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected; rebasing onto the current remote tip (attempt $attempt)."
            git pull --rebase -X theirs origin main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
