name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */4 * * *"  # Runs every 4 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dot-agi
          # Same ramp as the 3D graph and the activity graph, so all three match.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FCEE0A&color_dots=#12161C,#1A5561,#00A5B5,#00F0FF,#FCEE0A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FCEE0A&color_dots=#12161C,#1A5561,#00A5B5,#00F0FF,#FCEE0A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
